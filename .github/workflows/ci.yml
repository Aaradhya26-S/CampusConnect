name: Campus Connect CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Build, Lint & Test Full-Stack App
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: test-super-secret-ci-jwt-key-32chars-min
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/campus_connect_test?schema=public"
      DEMO_MODE: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Run Client Linting & Typecheck
        run: |
          cd client
          npm run lint

      - name: Run Client Tests
        run: |
          cd client
          npm run test

      - name: Build Client
        run: |
          cd client
          npm run build

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Server Linting & Typecheck
        run: |
          cd server
          npm run lint

      - name: Run Server Tests
        run: |
          cd server
          npm run test

      - name: Build Server
        run: |
          cd server
          npm run build
